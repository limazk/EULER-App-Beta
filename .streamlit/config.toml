# Identidade visual EULER: tema escuro (D61, pedido do Adryan em 01/10/2026).
# Fundo grafite quase preto, barra lateral mais escura, texto claro e interface monocromática;
# cor só onde ela informa (alertas, selos, os dois períodos comparados e os gráficos).
# As cores das categorias dos gráficos são a paleta validada para fundo escuro
# (app/graficos.py, CORES).
[theme]
base = "dark"
primaryColor = "#F5F7FA"
backgroundColor = "#05070B"
secondaryBackgroundColor = "#0D121B"
textColor = "#F5F7FA"
linkColor = "#60A5FA"
borderColor = "#202733"
showWidgetBorder = true
baseRadius = "0.5rem"
buttonRadius = "0.45rem"
headingFontWeights = [650, 600, 600, 600, 600, 600]
headingFontSizes = ["2.1rem", "1.45rem", "1.2rem", "1.05rem", "1rem", "0.95rem"]
metricValueFontSize = "1.85rem"
metricValueFontWeight = 600
dataframeHeaderBackgroundColor = "#111722"
chartCategoricalColors = ["#3987e5", "#d95926", "#199e70", "#c98500", "#d55181", "#008300", "#38bdf8", "#e66767"]
yellowBackgroundColor = "#3A3220"
yellowTextColor = "#F2C94C"
blueBackgroundColor = "#1F2A3A"
blueTextColor = "#A8C7FA"
greenBackgroundColor = "#1E3328"
greenTextColor = "#7BD8A6"
redBackgroundColor = "#3B2323"
redTextColor = "#F28B82"
orangeBackgroundColor = "#3A2A1E"
orangeTextColor = "#F6AD6B"
violetBackgroundColor = "#1F2A3A"
violetTextColor = "#93C5FD"
grayBackgroundColor = "#171E29"
grayTextColor = "#CBD5E1"

[theme.sidebar]
backgroundColor = "#080B11"
secondaryBackgroundColor = "#111722"
textColor = "#F5F7FA"
borderColor = "#202733"

[browser]
gatherUsageStats = false

[client]
toolbarMode = "viewer"
