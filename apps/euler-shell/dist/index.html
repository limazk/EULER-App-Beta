<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <title>EULER · Conectando</title>
  <link rel="stylesheet" href="startup.css" />
</head>
<body>
  <main class="shell" aria-live="polite">
    <section class="brand" aria-label="EULER">
      <div class="mark" aria-hidden="true">E</div>
      <div>
        <h1>EULER</h1>
        <p>Investigação industrial</p>
      </div>
    </section>

    <section class="status-card">
      <div class="spinner" aria-hidden="true"></div>
      <div class="copy">
        <span class="eyebrow" id="eyebrow">INICIANDO</span>
        <h2 id="title">Conectando à EULER...</h2>
        <p id="message">Preparando seu ambiente de trabalho.</p>
      </div>
    </section>

    <div class="actions" id="actions" hidden>
      <a class="retry" id="retry" href="https://retry.euler.local/">Tentar novamente</a>
    </div>

    <p class="hint" id="hint">A primeira conexão pode levar alguns segundos.</p>
  </main>

  <script src="startup.js"></script>
</body>
</html>
