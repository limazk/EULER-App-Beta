[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "euler-core"
version = "0.0.1"
description = "EULER · investigação física para caldeiras industriais (protótipo, Fase 0)"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.26",
    "iapws>=1.5",
    "streamlit>=1.36",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]
prints = [
    "playwright>=1.40",
]
# Só para a verificação independente do motor (tests/test_validacao_*.py): outras
# implementações de referência (IAPWS-95 e equações de estado de gases; dados NASA).
# Não são usadas pelo motor; sem elas esses testes são pulados.
validacao = [
    "CoolProp>=6.6",
    "cantera>=3.0",
]

[tool.setuptools.packages.find]
include = ["euler*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
# lab/ guarda a calculadora de referência para os revisores, copiada exatamente
# como veio do arquivo mestre; não é código do produto.
extend-exclude = ["lab"]

[tool.ruff.format]
# tests/golden/ é somente leitura para agentes (regra 6 do AGENTS.md).
exclude = ["tests/golden/*"]
