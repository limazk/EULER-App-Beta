name: Publish EULER Beta Release

on:
  push:
    branches:
      - feature/auth-beta
    paths:
      - ".github/workflows/publish-release.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

env:
  RELEASE_TAG: v0.1.0-beta.1
  RELEASE_TITLE: EULER v0.1.0 Beta 1

jobs:
  cancel-stale:
    name: Cancel stale release runs
    runs-on: ubuntu-latest
    steps:
      - name: Cancel older release runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow "publish-release.yml" \
            --branch "feature/auth-beta" \
            --status in_progress \
            --json databaseId \
            --jq '.[].databaseId' |
          while read -r run_id; do
            [ -z "$run_id" ] && continue
            if [ "$run_id" != "$GITHUB_RUN_ID" ]; then
              echo "Cancelling stale release run $run_id"
              gh run cancel "$run_id" --repo "$GITHUB_REPOSITORY" || true
            fi
          done

  build:
    name: Build ${{ matrix.name }}
    needs: cancel-stale
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-22.04
            bundles: appimage,deb
            artifact: euler-linux
          - name: Windows
            os: windows-latest
            bundles: nsis
            artifact: euler-windows

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        working-directory: apps/euler-shell

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri CLI
        run: npm install

      - name: Generate EULER app icons
        run: npm run tauri icon ../../app/imagens/euler_app_icone.svg

      - name: Build installers
        run: npm run build -- --bundles ${{ matrix.bundles }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            apps/euler-shell/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/euler-shell/src-tauri/target/release/bundle/deb/*.deb
            apps/euler-shell/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Validate final installers
        run: |
          set -euo pipefail
          find release-assets -type f -print
          test "$(find release-assets -type f -name '*.AppImage' | wc -l)" -ge 1
          test "$(find release-assets -type f -name '*.deb' | wc -l)" -ge 1
          test "$(find release-assets -type f -name '*.exe' | wc -l)" -ge 1

      - name: Create clean beta release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: |
            Primeira versão instalável do EULER Beta.

            Linux:
            - AppImage
            - pacote .deb

            Windows:
            - instalador NSIS (.exe)

            EULER — Precision for Industry
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            while IFS= read -r asset; do
              [ -z "$asset" ] && continue
              gh release delete-asset "$RELEASE_TAG" "$asset" \
                --repo "$GITHUB_REPOSITORY" \
                --yes
            done < <(gh release view "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --json assets \
              --jq '.assets[].name')
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TITLE" \
              --prerelease \
              --notes "$RELEASE_NOTES"
          fi

          while IFS= read -r -d '' file; do
            gh release upload "$RELEASE_TAG" "$file" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          done < <(find release-assets -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.exe' \) -print0)
