name: Publish EULER Beta Release

on:
  push:
    branches:
      - feature/auth-beta
    paths:
      - ".github/workflows/publish-release.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  RELEASE_TAG: v0.1.0-beta.1
  RELEASE_TITLE: EULER v0.1.0 Beta 1

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-22.04
            bundles: appimage,deb
            artifact: euler-linux
          - name: Windows
            os: windows-latest
            bundles: nsis
            artifact: euler-windows

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        working-directory: apps/euler-shell

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri CLI
        run: npm install

      - name: Generate EULER app icons
        run: npm run tauri icon ../../app/imagens/euler_app_icone.svg

      - name: Build installers
        run: npm run build -- --bundles ${{ matrix.bundles }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: apps/euler-shell/src-tauri/target/release/bundle/**
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: List release files
        run: find release-assets -type f -maxdepth 5 -print

      - name: Create or update beta release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; updating assets."
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TITLE" \
              --prerelease \
              --notes "Primeira versão instalável do EULER Beta.

Linux:
- AppImage
- pacote .deb

Windows:
- instalador NSIS (.exe)

EULER — Precision for Industry"
          fi

          while IFS= read -r -d '' file; do
            gh release upload "$RELEASE_TAG" "$file" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          done < <(find release-assets -type f -print0)
