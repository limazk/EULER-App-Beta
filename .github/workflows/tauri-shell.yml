name: Tauri Shell

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/euler-shell/**"
      - ".github/workflows/tauri-shell.yml"

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-22.04
            bundles: appimage,deb
            artifact: euler-linux
          - name: Windows
            os: windows-latest
            bundles: nsis
            artifact: euler-windows

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        working-directory: apps/euler-shell

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri CLI
        run: npm install

      - name: Build installers
        run: npm run build -- --bundles ${{ matrix.bundles }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: apps/euler-shell/src-tauri/target/release/bundle/**
          if-no-files-found: error
