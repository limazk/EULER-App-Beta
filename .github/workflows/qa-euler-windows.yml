name: QA Windows - EULER installer (isolated)

on:
  pull_request:
    paths:
      - ".github/workflows/qa-euler-windows.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  smoke-windows:
    name: Windows NSIS native install / launch / uninstall
    runs-on: windows-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Get exact approved release artifact
        uses: actions/download-artifact@v4
        with:
          name: euler-windows
          run-id: "38211447620"
          path: windows-qa-artifacts
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Check installer SHA-256, run silent native install
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $a = @(Get-ChildItem -Path "windows-qa-artifacts" -Recurse -File -Filter "EULER_0.1.0-beta.1_x64-setup.exe")
          if ($a.Count -ne 1) { throw "Expected one official NSIS installer; found $($a.Count)" }
          $actual = (Get-FileHash $a[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = "375eb281abc653b9aab5ea92a4a51fd9b2911dd8c089dde696635f20b1107cbe"
          if ($actual -ne $expected) { throw "Installer SHA256 mismatch: $actual" }
          $dest = Join-Path $env:RUNNER_TEMP "EulerQAInstall"
          Write-Host "SHA verified; intended install dir: $dest"
          $proc = Start-Process -FilePath $a[0].FullName -ArgumentList "/S",("/D=" + $dest) -PassThru -Wait
          Write-Host "NSIS exit code: $($proc.ExitCode)"
          if ($proc.ExitCode -ne 0) { throw "NSIS installation failed: exit $($proc.ExitCode)" }
          if (-not (Test-Path $dest)) { throw "NSIS did not create expected install directory" }
          $exes = @(Get-ChildItem -Path $dest -Recurse -File -Filter "*.exe")
          $exes | ForEach-Object { Write-Host "Installed EXE: $($_.FullName)" }
          $app = $exes | Where-Object { $_.Name -eq "euler-app.exe" } | Select-Object -First 1
          if (-not $app) { throw "euler-app.exe not found in installation" }
          "EULER_APP_EXE=$($app.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "EULER_INSTALL_DIR=$dest" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "### EULER Windows smoke" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "- SHA-256 official installer: PASS" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "- NSIS silent installation: PASS" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
      - name: Attempt startup (non-interactive CI, no GUI claim)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $app = $env:EULER_APP_EXE
          if (-not (Test-Path $app)) { throw "Installed app does not exist" }
          $proc = Start-Process -FilePath $app -PassThru -ErrorAction Stop
          Write-Host "Launched EULER PID $($proc.Id)"
          Start-Sleep -Seconds 10
          $running = Get-Process -Id $proc.Id -ErrorAction SilentlyContinue
          if ($running) {
            Write-Host "EULER process still running after 10s"
            "- Native Windows process remains running at 10s: PASS (GUI is not validated)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          } else {
            Write-Warning "EULER exited in non-interactive runner. This does not establish a GUI regression; needs interactive desktop test."
            "- Native Windows startup: INCONCLUSIVE (process exited; non-interactive CI)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }
          if ($running) {
            $ui = Get-Process -Id $proc.Id -ErrorAction SilentlyContinue
            Write-Host "Window handle: $($ui.MainWindowHandle); title: $($ui.MainWindowTitle)"
            if ($ui.MainWindowHandle -ne 0) {
              "- Win32 main window handle: DETECTED (not a functional UI/login test)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            } else {
              "- Win32 main window handle: NOT DETECTED in CI session (inconclusive)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            }
            try {
              Add-Type -AssemblyName System.Windows.Forms
              Add-Type -AssemblyName System.Drawing
              $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
              $bmp = New-Object System.Drawing.Bitmap($bounds.Width,$bounds.Height)
              $gfx = [System.Drawing.Graphics]::FromImage($bmp)
              $gfx.CopyFromScreen(0,0,0,0,$bmp.Size)
              $bmp.Save("windows-qa-screenshot.png",[System.Drawing.Imaging.ImageFormat]::Png)
              $gfx.Dispose(); $bmp.Dispose()
              Write-Host "Screenshot saved (inspect for blank/interactive state)"
              if ($bounds.Width -ge 1024 -and $bounds.Height -ge 768) {
                Add-Type -TypeDefinition @"
using System;
using System.Runtime.InteropServices;
public static class EulerQAMouse {
  [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr hWnd);
  [DllImport("user32.dll")] public static extern bool SetCursorPos(int X, int Y);
  [DllImport("user32.dll")] public static extern void mouse_event(uint flags, uint dx, uint dy, uint dwData, IntPtr extraInfo);
}
"@
                [EulerQAMouse]::SetForegroundWindow([IntPtr]$ui.MainWindowHandle) | Out-Null
                Start-Sleep -Milliseconds 300
                [EulerQAMouse]::SetCursorPos(847,110) | Out-Null
                [EulerQAMouse]::mouse_event(2,0,0,0,[IntPtr]::Zero)
                [EulerQAMouse]::mouse_event(4,0,0,0,[IntPtr]::Zero)
                Start-Sleep -Seconds 2
                $b = New-Object System.Drawing.Bitmap($bounds.Width,$bounds.Height)
                $g = [System.Drawing.Graphics]::FromImage($b)
                $g.CopyFromScreen(0,0,0,0,$b.Size)
                $b.Save("windows-qa-light-toggle.png",[System.Drawing.Imaging.ImageFormat]::Png)
                $g.Dispose(); $b.Dispose()
                Write-Host "Captured theme toggle screenshot"
                [EulerQAMouse]::SetCursorPos(407,415) | Out-Null
                [EulerQAMouse]::mouse_event(2,0,0,0,[IntPtr]::Zero)
                [EulerQAMouse]::mouse_event(4,0,0,0,[IntPtr]::Zero)
                Start-Sleep -Seconds 2
                $b = New-Object System.Drawing.Bitmap($bounds.Width,$bounds.Height)
                $g = [System.Drawing.Graphics]::FromImage($b)
                $g.CopyFromScreen(0,0,0,0,$b.Size)
                $b.Save("windows-qa-signup-tab.png",[System.Drawing.Imaging.ImageFormat]::Png)
                $g.Dispose(); $b.Dispose()
                Write-Host "Captured signup tab screenshot (navigation only, no form submission)"
              }
            } catch { Write-Warning "Screenshot unavailable on non-interactive runner: $($_.Exception.Message)" }
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          }
      - name: Export screenshot if Windows runner permits
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-windows-window-capture
          path: windows-qa-*.png
          if-no-files-found: ignore
          retention-days: 3
      - name: Uninstall and verify cleanup
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dest = Join-Path $env:RUNNER_TEMP "EulerQAInstall"
          if (-not (Test-Path $dest)) {
            Write-Host "Not installed; skipping uninstall test"
            exit 0
          }
          $un = @(Get-ChildItem -Path $dest -Recurse -File -Filter "*.exe" | Where-Object { $_.Name -match "uninstall|uninst" })
          if ($un.Count -eq 0) {
            Write-Warning "Uninstaller not found at expected custom directory"
            "- Uninstallation: NOT CONFIRMED (no uninstaller discovered)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            exit 1
          }
          $proc = Start-Process -FilePath $un[0].FullName -ArgumentList "/S" -Wait -PassThru
          Write-Host "Uninstaller exit: $($proc.ExitCode)"
          if ($proc.ExitCode -ne 0) { throw "Uninstaller failed" }
          Start-Sleep -Seconds 2
          $binary = Join-Path $dest "euler-app.exe"
          if (Test-Path $binary) { throw "App binary still present after uninstall" }
          "- NSIS silent uninstall: PASS" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
      - name: Security note
        if: always()
        shell: pwsh
        run: |
          "- No production credentials, login, GUI screenshots or Render deploys were used in this workflow." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
