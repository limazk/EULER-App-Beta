name: CI

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar
        run: pip install -e ".[dev,validacao]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Testes
        env:
          EULER_TEST_BYPASS_AUTH: "1"
        run: pytest -q
