<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="EULER">
  <!-- Marca EULER: um "E" feito de barras, como num balanço de energia
       (o que entrou, o que virou vapor, o que se perdeu), sobre fundo ferrugem. -->
  <rect width="32" height="32" rx="7" fill="#C2410C"/>
  <rect x="8" y="7.5" width="4" height="17" rx="1.5" fill="#FFFFFF"/>
  <rect x="8" y="7.5" width="16" height="4" rx="1.5" fill="#FFFFFF"/>
  <rect x="8" y="14" width="11" height="4" rx="1.5" fill="#FFFFFF" fill-opacity="0.85"/>
  <rect x="8" y="20.5" width="16" height="4" rx="1.5" fill="#FFFFFF"/>
</svg>
